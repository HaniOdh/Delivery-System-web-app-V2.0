
    {% extends "base/base.html" %}
    {% block title %}Login - Delivery System{% endblock %}
    {% block content %}
    <div class="d-flex justify-content-center " style="background-color:#ffffff; margin-top: 70px;margin-bottom: 120px;">
        <div class="bg-white p-4 " style="width:380px;">

                <h2 class="text-center fw-bold mb-1" >Log in</h2>
                <p class="text-center text-muted fw-500 mb-4">Enter your credentials to sign in</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="email" class="form-label fw-medium"  >Email<span class="text-danger">*</span></label>
                        <input type="text" id="email" name="email" class="form-control" placeholder="Email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-medium"  >Password<span class="text-danger">*</span></label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>
                    </div>
                    
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="remember" id="remember">
                            <label class="form-check-label" for="remember">
                                Remember me
                            </label>
                        </div>
                        <a href="{% url 'password_reset' %}" class="text-primary text-decoration-none" style=" font-weight: 500;">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Log in</button>
                    
                </form>
                <p class="text-center mt-3">Don't have an account ?<a href = "{% url 'signup' %}">Sign up here</a></p>
        </div>    
    </div>
{% endblock %}
